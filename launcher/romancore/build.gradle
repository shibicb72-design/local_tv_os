plugins {
    id 'com.android.library'
}

android {
    namespace 'com.gathin.roman'
    compileSdk 34

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only: plain JVM tests for the pure Roman classes, src/test.
    testImplementation 'junit:junit:4.13.2'
}
